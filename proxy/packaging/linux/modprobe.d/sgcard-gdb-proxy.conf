# /etc/modprobe.d/sgcard-gdb-proxy.conf
#
# 把 gdb-proxy 的启停纳入 modprobe(8) 的标准生命周期：
#   - modprobe sgcard      装载模块成功后扫描设备并启动全部 gdb-proxy@N
#   - modprobe -r sgcard   先停止全部实例（释放 /dev fd），再卸载模块
#
# --ignore-install / --ignore-remove 用于避免 modprobe 递归调用本钩子。
# 若 modprobe 在 /usr/sbin/modprobe，请相应替换路径。

install sgcard /sbin/modprobe --ignore-install sgcard $CMDLINE_OPTS && /usr/lib/tpu-gdb-proxy/scripts/gdb_proxy_instances.sh start

remove sgcard /usr/lib/tpu-gdb-proxy/scripts/gdb_proxy_instances.sh stop ; /sbin/modprobe -r --ignore-remove sgcard $CMDLINE_OPTS
